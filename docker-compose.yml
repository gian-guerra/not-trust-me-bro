name: not-trust-me-bro

services:
  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.40.7
    command: ["--host", "0.0.0.0", "--port", "8080", "--scheme", "http"]
    ports:
      - "8080:8080"   # REST API
      - "50051:50051" # gRPC, used by the Python client for fast queries and batch inserts
    volumes:
      - weaviate_data:/var/lib/weaviate
    environment:
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      # Local single-user setup. Turn auth on before exposing this anywhere.
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      # We compute embeddings ourselves (sentence-transformers), so Weaviate doesn't need a vectorizer.
      # Cloud modules (OpenAI, Cohere, ...) are loaded but idle: our collections use no vectorizer.
      DEFAULT_VECTORIZER_MODULE: none
      CLUSTER_HOSTNAME: node1
    restart: unless-stopped

volumes:
  weaviate_data:
